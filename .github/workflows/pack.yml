

name: Build Phicomm N1 Image


on:

  workflow_dispatch:

    inputs:

      kernel:

        description: "选择 ophub kernel"

        required: true

        default: "6.1.y"

        type: choice

        options:

          - 5.15.y
          - 6.1.y
          - 6.12.y



jobs:


  build:


    runs-on: ubuntu-22.04



    steps:



    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y wget git



    # 下载你的 Release rootfs

    - name: Download LEDE rootfs
      run: |

       wget -O rootfs.tar.gz "https://github.com/q1016390482/-/releases/download/2026.08.09-1958/openwrt-amlogic-mesongx-phicomm_n1-rootfs.tar.gz"

       ls -lh rootfs.tar.gz


    # 下载 ophub

    - name: Clone ophub

      run: |
       git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-openwrt.git ophub



    # 放入 ophub 指定目录

    - name: Prepare rootfs

      run: |


        mkdir -p ophub/openwrt-armsr


        cp rootfs.tar.gz ophub/openwrt-armsr/openwrt-armvirt-64-default-rootfs.tar.gz



    # 开始打包 N1

    - name: Build N1 image

      run: |


        cd ophub


        chmod +x remake


        sudo ./remake \

        -b s905d \

        -k ${{ inputs.kernel }}



    # 查找镜像

    - name: Find image

      run: |


        find . -name "*.img.gz"



    # 上传最终固件

    - name: Upload N1 firmware

      uses: actions/upload-artifact@v4


      with:


        name: OpenWrt-N1-${{ inputs.kernel }}


        path: |

          ophub/**/*.img.gz


        retention-days: 7
