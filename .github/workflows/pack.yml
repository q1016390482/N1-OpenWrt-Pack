name: Build Phicomm N1 Image

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "选择 ophub 内核版本"
        required: true
        default: "6.1.y"
        type: choice
        options:
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LEDE rootfs
        run: |
          wget -O rootfs.tar.gz "https://github.com/q1016390482/-/releases/download/2026.08.09-1958/openwrt-amlogic-mesongx-phicomm_n1-rootfs.tar.gz"
          ls -lh rootfs.tar.gz

      - name: Clone ophub
        run: |
          git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-openwrt.git ophub

      - name: Install ophub dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat ophub/make-openwrt/scripts/ubuntu2404-make-openwrt-depends)

      - name: Prepare rootfs
        run: |
          mkdir -p ophub/openwrt-armsr
          cp rootfs.tar.gz ophub/openwrt-armsr/openwrt-armvirt-64-default-rootfs.tar.gz
          ls -lh ophub/openwrt-armsr/openwrt-armvirt-64-default-rootfs.tar.gz

      - name: Build N1 image
        run: |
          cd ophub
          chmod +x remake
          sudo ./remake -b s905d -k "${{ inputs.kernel }}"

      - name: Find image
        run: |
          echo "===== ophub output ====="
          find ophub/openwrt/out -maxdepth 1 -type f -name "*.img.gz" -ls

      - name: Rename N1 image
        run: |
          mkdir -p output
          DATE=$(date +"%Y%m%d%H%M")
          IMAGE=$(find ophub/openwrt/out -maxdepth 1 -type f -name "*.img.gz" | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "未找到 N1 img.gz 镜像"
            exit 1
          fi
          cp "$IMAGE" "output/OpenWrt_N1_${{ inputs.kernel }}_${DATE}.img.gz"
          ls -lh output/

      - name: Upload N1 firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-N1-${{ inputs.kernel }}
          path: output/OpenWrt_N1_*.img.gz
          retention-days: 7
